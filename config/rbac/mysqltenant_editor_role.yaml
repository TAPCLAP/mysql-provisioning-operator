# This rule is not used by the project mysql-provisioning-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the mysql-provisioning.tapclap.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mysql-provisioning-operator
    app.kubernetes.io/managed-by: kustomize
  name: mysqltenant-editor-role
rules:
- apiGroups:
  - mysql-provisioning.tapclap.com
  resources:
  - mysqltenants
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mysql-provisioning.tapclap.com
  resources:
  - mysqltenants/status
  verbs:
  - get
