# This rule is not used by the project mysql-provisioning-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to mysql-provisioning.tapclap.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mysql-provisioning-operator
    app.kubernetes.io/managed-by: kustomize
  name: mysqluser-viewer-role
rules:
- apiGroups:
  - mysql-provisioning.tapclap.com
  resources:
  - mysqlusers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - mysql-provisioning.tapclap.com
  resources:
  - mysqlusers/status
  verbs:
  - get
