apiVersion: mysql-provisioning.tapclap.com/v1alpha1
kind: MySQLDatabase
metadata:
  labels:
    app.kubernetes.io/name: mysql-provisioning-operator
    app.kubernetes.io/managed-by: kustomize
  name: payments-main
  namespace: payments
spec:
  clusterRef:
    name: db1
    namespaceFrom: OperatorNamespace
  name: payments_main
  characterSet: utf8mb3
  collation: utf8mb3_general_ci
  target: Master
