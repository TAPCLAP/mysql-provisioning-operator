---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: mysqlusers.mysql-provisioning.tapclap.com
spec:
  group: mysql-provisioning.tapclap.com
  names:
    kind: MySQLUser
    listKind: MySQLUserList
    plural: mysqlusers
    shortNames:
    - muser
    singular: mysqluser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cluster
      name: Cluster
      type: string
    - jsonPath: .spec.username
      name: User
      type: string
    - jsonPath: .spec.secret.name
      name: Secret
      type: string
    - jsonPath: .status.master.name
      name: Master
      type: string
    - jsonPath: .status.memberNames
      name: Members
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MySQLUser is the Schema for the mysqlusers API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of MySQLUser
            properties:
              authPlugin:
                description: authPlugin is caching_sha2_password or mysql_native_password.
                enum:
                - caching_sha2_password
                - mysql_native_password
                type: string
              cluster:
                description: cluster is the MySQLCluster name in the operator namespace.
                minLength: 1
                type: string
              grants:
                description: grants are reconciled to SHOW GRANTS.
                items:
                  description: GrantSpec is one set of privileges on a database.
                  properties:
                    database:
                      description: database is the schema that receives the privileges.
                      maxLength: 64
                      minLength: 1
                      type: string
                    privileges:
                      description: privileges are the MySQL privileges to grant.
                      items:
                        type: string
                      minItems: 1
                      type: array
                    tables:
                      description: tables limits the grant. Empty or "*" means every
                        table.
                      items:
                        type: string
                      type: array
                  required:
                  - database
                  - privileges
                  type: object
                type: array
              hosts:
                description: |-
                  hosts are the MySQL account hosts. Empty defaults to ["%"].
                  Each user@host pair is a separate account.
                items:
                  type: string
                type: array
              maxQueriesPerHour:
                description: maxQueriesPerHour sets MAX_QUERIES_PER_HOUR when provided.
                format: int32
                minimum: 0
                type: integer
              maxUserConnections:
                description: maxUserConnections sets MAX_USER_CONNECTIONS when provided.
                format: int32
                minimum: 0
                type: integer
              password:
                description: password configures generation and rotation. The password
                  itself is never stored here.
                properties:
                  generation:
                    default: 1
                    description: generation is incremented to rotate the password
                      once.
                    format: int32
                    minimum: 0
                    type: integer
                  retention:
                    default: 24h
                    description: retention is how long the previous password stays
                      valid. Default 24h, minimum 5m.
                    type: string
                  rotateEvery:
                    description: rotateEvery rotates on a schedule. Empty means only
                      generation bumps rotate.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: retention must be at least 5m
                  rule: self.retention.size() == 0 || duration(self.retention) >=
                    duration('5m')
                - message: rotateEvery must be longer than retention
                  rule: '!has(self.rotateEvery) || self.rotateEvery.size() == 0 ||
                    duration(self.rotateEvery) > duration(self.retention.size() ==
                    0 ? ''24h'' : self.retention)'
              requireTLS:
                description: requireTLS sets REQUIRE SSL when true and REQUIRE NONE
                  when false.
                type: boolean
              secret:
                description: secret is the template for the application Secret.
                properties:
                  data:
                    additionalProperties:
                      type: string
                    description: data maps Secret keys to Go templates.
                    type: object
                  entries:
                    description: entries expand additional keys for each cluster member.
                    items:
                      description: SecretEntry expands one template for each cluster
                        member.
                      properties:
                        forEach:
                          description: |-
                            forEach is the collection to iterate. Only "members" is supported.
                            Inside the template, .Item.Index is the 1-based position in spec.members.
                          enum:
                          - members
                          type: string
                        key:
                          description: key is a Go template that renders the Secret
                            key.
                          minLength: 1
                          type: string
                        value:
                          description: value is a Go template that renders the Secret
                            value.
                          type: string
                      required:
                      - forEach
                      - key
                      type: object
                    type: array
                  name:
                    description: name is the Secret name in the same namespace as
                      the MySQLUser.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              target:
                description: target overrides the cluster default. Master or All.
                enum:
                - Master
                - All
                type: string
              username:
                description: |-
                  username is the MySQL account name, or the prefix when usernameSuffix is set.
                  It is immutable and at most 32 characters.
                maxLength: 32
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: username is immutable
                  rule: self == oldSelf
              usernameSuffix:
                description: |-
                  usernameSuffix appends random letters and digits to username.
                  Omit it to use username as the account name.
                properties:
                  length:
                    default: 8
                    description: |-
                      length is how many random characters are appended. Default 8.
                      The full account name stays within 32 characters.
                    format: int32
                    maximum: 31
                    minimum: 1
                    type: integer
                type: object
            required:
            - authPlugin
            - cluster
            - secret
            - username
            type: object
            x-kubernetes-validations:
            - message: username plus the random suffix must be at most 32 characters
              rule: '!has(self.usernameSuffix) || size(self.username) + (self.usernameSuffix.length
                > 0 ? self.usernameSuffix.length : 8) <= 32'
          status:
            description: status defines the observed state of MySQLUser
            properties:
              appliedOn:
                description: appliedOn lists member names where the account was applied.
                items:
                  type: string
                type: array
              conditions:
                description: conditions represent the current state of the MySQLUser
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              managedHosts:
                description: managedHosts are the hosts the operator last created,
                  used to drop removed hosts.
                items:
                  type: string
                type: array
              master:
                description: master is the selected primary at the last reconcile.
                properties:
                  attributes:
                    additionalProperties:
                      type: string
                    description: attributes are copied from the cluster member.
                    type: object
                  host:
                    description: host is the member host.
                    type: string
                  name:
                    description: name is the member name.
                    type: string
                  port:
                    description: port is the member port. 3306 when the cluster omits
                      it.
                    format: int32
                    type: integer
                required:
                - name
                type: object
              memberNames:
                description: |-
                  memberNames is the comma-separated member names from members.
                  kubectl prints this string. A JSONPath that matches several names stays empty.
                type: string
              members:
                description: |-
                  members lists cluster members with host, port, and attributes.
                  Target Master includes every cluster member. Target All includes the members where the account was applied.
                items:
                  description: EndpointStatus is a member address recorded on a database
                    or user.
                  properties:
                    attributes:
                      additionalProperties:
                        type: string
                      description: attributes are copied from the cluster member.
                      type: object
                    host:
                      description: host is the member host.
                      type: string
                    name:
                      description: name is the member name.
                      type: string
                    port:
                      description: port is the member port. 3306 when the cluster
                        omits it.
                      format: int32
                      type: integer
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              password:
                description: password holds rotation bookkeeping.
                properties:
                  generation:
                    description: generation is the spec.password.generation last applied.
                    format: int32
                    type: integer
                  hash:
                    description: hash is the SHA-256 of the password applied to MySQL.
                    type: string
                  retainedUntil:
                    description: retainedUntil is when the previous password is discarded.
                    format: date-time
                    type: string
                  rotatedAt:
                    description: rotatedAt is the time of the last password change.
                    format: date-time
                    type: string
                type: object
              username:
                description: username is the MySQL account name chosen for this object.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
