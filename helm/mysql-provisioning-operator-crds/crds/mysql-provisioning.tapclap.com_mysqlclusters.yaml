---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: mysqlclusters.mysql-provisioning.tapclap.com
spec:
  group: mysql-provisioning.tapclap.com
  names:
    kind: MySQLCluster
    listKind: MySQLClusterList
    plural: mysqlclusters
    shortNames:
    - mcluster
    singular: mysqlcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.master.name
      name: Master
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MySQLCluster is the Schema for the mysqlclusters API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of MySQLCluster
            properties:
              credentialsSecret:
                description: credentialsSecret holds username and password keys for
                  the admin account.
                properties:
                  name:
                    description: name is the Secret in the same namespace as the MySQLCluster.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              defaultTarget:
                default: Master
                description: defaultTarget is used when a database or user omits spec.target.
                enum:
                - Master
                - All
                type: string
              master:
                description: master configures how the writable primary is chosen.
                properties:
                  criteria:
                    description: |-
                      criteria are AND-ed together. Omitted criteria default to enabled.
                      Used only when mode is Detected.
                    properties:
                      noReplicationConfigured:
                        description: noReplicationConfigured requires no replication
                          source. Defaults to true.
                        type: boolean
                      readOnlyOff:
                        description: readOnlyOff requires @@global.read_only = 0.
                          Defaults to true.
                        type: boolean
                      superReadOnlyOff:
                        description: superReadOnlyOff requires @@global.super_read_only
                          = 0. Defaults to true.
                        type: boolean
                    type: object
                  mode:
                    description: mode is Detected or Explicit.
                    enum:
                    - Detected
                    - Explicit
                    type: string
                required:
                - mode
                type: object
              members:
                description: members are the MySQL servers in this cluster.
                items:
                  description: MySQLMember is one server in a MySQL cluster.
                  properties:
                    attributes:
                      additionalProperties:
                        type: string
                      description: |-
                        attributes are named values copied into secret templates and into
                        status.members and status.master on MySQLDatabase and MySQLUser.
                        A key matches ^[A-Za-z][A-Za-z0-9]{0,63}$. A value is at most 253 characters.
                      maxProperties: 16
                      type: object
                      x-kubernetes-validations:
                      - message: attribute keys must match ^[A-Za-z][A-Za-z0-9]{0,63}$
                          and values must be at most 253 characters
                        rule: self.all(k, k.matches('^[A-Za-z][A-Za-z0-9]{0,63}$')
                          && size(self[k]) <= 253)
                    host:
                      description: host is the DNS name or address the operator dials.
                      maxLength: 253
                      minLength: 1
                      type: string
                    master:
                      description: master marks the explicit primary. It is valid
                        only when spec.master.mode is Explicit.
                      type: boolean
                    name:
                      description: name is a stable identifier used in status and
                        secret templates.
                      maxLength: 64
                      minLength: 1
                      pattern: ^[A-Za-z0-9_.-]+$
                      type: string
                    port:
                      default: 3306
                      description: port is the MySQL port. Defaults to 3306.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                  required:
                  - host
                  - name
                  type: object
                maxItems: 32
                minItems: 1
                type: array
              privilegeReplication:
                default: Replicated
                description: privilegeReplication tells the operator whether DDL replicates
                  through the binlog.
                enum:
                - Replicated
                - Local
                type: string
              tls:
                description: tls configures the operator connection to MySQL. Omitted
                  or Disabled is plaintext.
                properties:
                  caConfigMap:
                    description: |-
                      caConfigMap holds a PEM bundle in data or binaryData. key defaults to ca.crt.
                      It is trusted in addition to the system pool.
                      Allowed only when mode is Required. Mutually exclusive with caSecret.
                    properties:
                      key:
                        default: ca.crt
                        description: key is the data key. Defaults to ca.crt.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: name is the object in the same namespace as the
                          MySQLCluster.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  caSecret:
                    description: |-
                      caSecret holds a PEM bundle. key defaults to ca.crt.
                      It is trusted in addition to the system pool.
                      Allowed only when mode is Required. Mutually exclusive with caConfigMap.
                    properties:
                      key:
                        default: ca.crt
                        description: key is the data key. Defaults to ca.crt.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: name is the object in the same namespace as the
                          MySQLCluster.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  clientSecret:
                    description: |-
                      clientSecret holds tls.crt and tls.key for mutual TLS.
                      Allowed when mode is Required or SkipVerify.
                    properties:
                      name:
                        description: name is the Secret in the same namespace as the
                          MySQLCluster.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  mode:
                    default: Disabled
                    description: mode is Disabled, Required, or SkipVerify. Defaults
                      to Disabled.
                    enum:
                    - Disabled
                    - Required
                    - SkipVerify
                    type: string
                  serverName:
                    description: |-
                      serverName is the certificate name used for verification and SNI.
                      Empty uses each member host.
                    maxLength: 253
                    type: string
                type: object
            required:
            - credentialsSecret
            - master
            - members
            type: object
            x-kubernetes-validations:
            - message: target All is incompatible with privilegeReplication Replicated
              rule: '!(self.privilegeReplication == ''Replicated'' && self.defaultTarget
                == ''All'')'
            - message: Explicit mode requires exactly one member with master true
              rule: self.master.mode != 'Explicit' || self.members.filter(m, has(m.master)
                && m.master).size() == 1
            - message: Detected mode forbids member.master
              rule: self.master.mode != 'Detected' || !self.members.exists(m, has(m.master)
                && m.master)
            - message: at least one master criterion must be enabled
              rule: '!has(self.master.criteria) || (!has(self.master.criteria.readOnlyOff)
                || self.master.criteria.readOnlyOff) || (!has(self.master.criteria.superReadOnlyOff)
                || self.master.criteria.superReadOnlyOff) || (!has(self.master.criteria.noReplicationConfigured)
                || self.master.criteria.noReplicationConfigured)'
          status:
            description: status defines the observed state of MySQLCluster
            properties:
              conditions:
                description: conditions represent the current state of the MySQLCluster
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              master:
                description: master is the selected primary, when one could be chosen.
                properties:
                  host:
                    description: host is the member host.
                    type: string
                  name:
                    description: name is the member name.
                    type: string
                  port:
                    description: port is the member port.
                    format: int32
                    type: integer
                  reason:
                    description: reason is Detected or Explicit.
                    type: string
                  wouldPassCriteria:
                    description: wouldPassCriteria reports whether an explicit master
                      also matches criteria.
                    type: boolean
                type: object
              members:
                description: members contains one entry per spec member.
                items:
                  description: MemberStatus is the last probe of one member.
                  properties:
                    matchesCriteria:
                      description: matchesCriteria is true when every enabled criterion
                        passed.
                      type: boolean
                    message:
                      description: message explains a probe failure.
                      type: string
                    name:
                      description: name is the member name.
                      type: string
                    reachable:
                      description: reachable is true when the probe connected.
                      type: boolean
                    readOnly:
                      description: readOnly is @@global.read_only.
                      type: boolean
                    replicationConfigured:
                      description: replicationConfigured is true when a replication
                        source is configured.
                      type: boolean
                    serverID:
                      description: serverID is @@global.server_id.
                      type: string
                    superReadOnly:
                      description: superReadOnly is @@global.super_read_only.
                      type: boolean
                  required:
                  - matchesCriteria
                  - name
                  - reachable
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
